name: Build and Release uYouEnhanced

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Direct URL to the decrypted YouTube IPA file"
        required: true
        default: ""
        type: string

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git ~/theos
          echo "THEOS=~/theos" >> $GITHUB_ENV

      - name: Download YouTube IPA
        run: |
          curl -L -o main/YouTube.ipa "${{ github.event.inputs.ipa_url }}"

      - name: Build Package
        run: |
          make clean package FINALPACKAGE=1

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: uYouEnhanced-IPA
          path: main/packages/*.ipa
